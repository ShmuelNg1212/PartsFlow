[project]
name = "partsflow-ocr"
version = "0.1.0"
description = "Local PaddleOCR worker for PartsFlow development. Synthetic invoices only."
requires-python = "==3.11.*"
dependencies = [
  "paddlepaddle==3.3.1",
  "paddleocr[doc-parser]==3.7.0",
  "paddlex==3.7.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
